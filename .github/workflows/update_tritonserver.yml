
name: Download model huggingface to Docker Image

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  workflow_dispatch:
  push:
    branches: [ "dev/build-docker" ]

jobs:
  docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tritonserver: [24.12]
        model_type: ['onnx', 'openvino', 'tensorrt']

    env:
      TRT_VERSION: ${{ matrix.tritonserver }}
      MODEL_TYPE: ${{ matrix.model_type }}
      REPOS: ${{ secrets.HF_REPOS }}
      TOKEN: ${{ secrets.HF_TOKEN }} 
      REPO_NAME: ${{ github.event.repository.name }}"

    steps:
      - name: Remove unnecessary files
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      -
        name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      -
        name: Build and push
        uses: docker/build-push-action@v5
        with:
          push: true
          file: ./build/Dockerfile.model
          platforms: linux/amd64
          tags: ${{ secrets.DOCKER_USERNAME }}/modelhub:${{ github.event.repository.name }}-triton${{ matrix.tritonserver }}-${{ matrix.model_type }}
          build-args: |
            MODEL_TYPE=$MODEL_TYPE
            REPOS=$REPOS
            TOKEN=$TOKEN